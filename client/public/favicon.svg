<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10FFA0" />
      <stop offset="100%" stop-color="#00DF81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00DF81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle inner glow ring -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#00DF81" stroke-opacity="0.22" stroke-width="1" />

  <!-- Cloud with Download Arrow -->
  <g transform="translate(10, 10) scale(1.83)" filter="url(#glow)">
    <!-- Cloud shape -->
    <path 
      d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" 
      stroke="url(#mint-grad)" 
      stroke-width="2.3" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="#00DF81"
      fill-opacity="0.14"
    />
    <!-- Download Arrow -->
    <path 
      d="M12 11v6" 
      stroke="#FFFFFF" 
      stroke-width="2.3" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <path 
      d="m9.5 14.5 2.5 2.5 2.5-2.5" 
      stroke="#FFFFFF" 
      stroke-width="2.3" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
