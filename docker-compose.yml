version: '3.8'

services:
  # Ace Stream Engine Daemon (Connects to P2P swarms and exposes HTTP stream / HLS port 6878)
  acestream:
    image: magnetikonline/acestream-server:latest
    container_name: seedr-acestream-engine
    restart: unless-stopped
    ports:
      - "6878:6878"   # HTTP Engine & Stream API
      - "8621:8621"   # P2P Torrent/AceStream Swarm Port
    environment:
      - ACESTREAM_HTTP_PORT=6878
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6878/server/api?method=get_version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Seedr & Ace Stream Web Server
  seedr-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: seedr-web-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ACESTREAM_ENGINE_URL=http://acestream:6878
    env_file:
      - server/.env
    depends_on:
      - acestream
